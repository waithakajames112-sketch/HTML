.adobe-fonts-dialog {
  height: 90%;
  max-height: 750px; }
  .adobe-fonts-dialog fieldset {
    padding: 0; }
  .adobe-fonts-dialog .content {
    height: 100%;
    padding-left: 0;
    padding-right: 0;
    position: relative;
    width: 650px; }
  .adobe-fonts-dialog.with-nav {
    max-width: 950px;
    padding-left: 300px; }
    .adobe-fonts-dialog.with-nav .nav {
      width: 300px; }
  .adobe-fonts-dialog .search-bar {
    display: flex;
    margin-bottom: 25px; }
    .adobe-fonts-dialog .search-bar .input-text {
      flex: 1;
      margin-right: 10px; }
  .adobe-fonts-dialog .btn-search {
    padding: 0 12px; }
    .adobe-fonts-dialog .btn-search .icon {
      margin-top: -1px; }
    .adobe-fonts-dialog .btn-search:hover .icon,
    .adobe-fonts-dialog .btn-search:focus .icon {
      fill: #fff; }
  .adobe-fonts-dialog .font-info-panel {
    background: #fcfcfc;
    border-bottom: 1px solid #e7e7e7;
    height: calc(100% - 90px);
    margin-top: -25px;
    overflow-y: auto;
    padding: 30px 40px;
    position: absolute;
    width: 100%; }
  .adobe-fonts-dialog .clear-search {
    color: #999;
    cursor: pointer;
    font-size: 12px;
    position: absolute;
    right: 120px;
    top: 32px; }
    .adobe-fonts-dialog .clear-search:hover {
      text-decoration: underline; }
  .adobe-fonts-dialog .search-bar,
  .adobe-fonts-dialog .tabs {
    padding: 0 40px; }
  .adobe-fonts-dialog .tabs {
    margin: 0;
    position: relative;
    z-index: 1; }
  .adobe-fonts-dialog .font-dropdown {
    position: absolute;
    right: 40px; }
  .adobe-fonts-dialog .tabsections {
    background: #fcfcfc;
    border-bottom: 1px solid #e7e7e7;
    height: calc(100% - 205px);
    margin: -1px 0 0;
    padding-right: 0;
    padding-top: 0;
    position: absolute;
    width: 100%; }
    .adobe-fonts-dialog .tabsections section {
      height: 100%;
      overflow: auto; }
  .adobe-fonts-dialog .controls {
    bottom: 30px;
    padding-left: 40px;
    padding-right: 40px;
    position: absolute;
    width: 100%; }
  .adobe-fonts-dialog .back {
    color: #999;
    cursor: pointer; }

.filter {
  border-bottom: 1px solid rgba(0, 0, 0, 0.3);
  padding: 18px 0 10px 20px; }

.filter-header {
  font-weight: bold;
  margin-bottom: 10px; }

.filter-option {

  margin-right: 8px;

  text-align: center;

  .filter-option:hover .filter-option-button {

  .filter-option input {
